<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Truck Dispatch Pro | Driver Welcome</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 20% 30%, #0b1120, #0a0f1c);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ========== ANIMATED BACKGROUND ========== */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Floating orbs with depth */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(233, 69, 96, 0.2), rgba(15, 52, 96, 0.05));
            filter: blur(40px);
            animation: floatGlow 20s infinite alternate ease-in-out;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            100% { transform: translate(40px, -30px) scale(1.2); opacity: 0.7; }
        }

        .orb-1 { width: 45vw; height: 45vw; top: -15%; right: -10%; background: #e9456033; }
        .orb-2 { width: 50vw; height: 50vw; bottom: -20%; left: -15%; background: #0f346033; animation-duration: 25s; }
        .orb-3 { width: 30vw; height: 30vw; top: 40%; left: 20%; background: #e9456022; animation-duration: 18s; }

        .moving-truck {
            position: absolute;
            bottom: 6%;
            left: -120px;
            font-size: clamp(2.8rem, 8vw, 4.5rem);
            color: rgba(233, 69, 96, 0.2);
            animation: driveTruck 22s linear infinite;
            z-index: 1;
            white-space: nowrap;
        }

        @keyframes driveTruck {
            0% { left: -120px; transform: scaleX(1); }
            49% { transform: scaleX(1); }
            50% { transform: scaleX(-1); }
            100% { left: calc(100% + 120px); transform: scaleX(-1); }
        }

        .float-icon {
            position: absolute;
            font-size: clamp(1.5rem, 5vw, 2.2rem);
            color: rgba(233, 69, 96, 0.12);
            animation: slowFloat 14s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes slowFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(8deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .ic-1 { top: 12%; left: 3%; animation-duration: 16s; }
        .ic-2 { top: 78%; left: 88%; animation-duration: 19s; animation-delay: 1s; }
        .ic-3 { top: 22%; right: 4%; animation-duration: 13s; }
        .ic-4 { bottom: 12%; left: 8%; animation-duration: 17s; }
        .ic-5 { top: 48%; left: 12%; animation-duration: 21s; }
        .ic-6 { top: 85%; left: 45%; animation-duration: 15s; }
        .ic-7 { top: 30%; left: 85%; animation-duration: 18s; }

        /* Particles vanish with style */
        .particle {
            position: absolute;
            background: rgba(233, 69, 96, 0.5);
            border-radius: 50%;
            animation: particleRise 9s linear infinite;
        }

        @keyframes particleRise {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            15% { opacity: 0.6; }
            85% { opacity: 0.4; }
            100% { transform: translateY(-15vh) rotate(360deg); opacity: 0; }
        }

        /* ========== MAIN CARD ========== */
        .welcome-card {
            position: relative;
            z-index: 20;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(0px);
            border-radius: 40px;
            padding: clamp(32px, 6vw, 52px);
            max-width: 560px;
            width: 100%;
            text-align: center;
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(233, 69, 96, 0.15);
            transition: all 0.2s ease;
            animation: cardPop 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        @keyframes cardPop {
            from { opacity: 0; transform: scale(0.95) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* TRUCK LOGO - REPLACED VICTORY SIGN */
        .truck-logo {
            width: 110px;
            height: 110px;
            background: linear-gradient(145deg, #1e2a3e, #0f1a2b);
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            box-shadow: 0 18px 28px -8px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            transition: transform 0.2s;
        }
        
        .truck-logo i {
            font-size: 4.2rem;
            color: #e94560;
            filter: drop-shadow(0 4px 10px rgba(233,69,96,0.3));
        }

        .truck-logo:hover {
            transform: scale(1.02);
        }

        h1 {
            font-size: clamp(1.8rem, 7vw, 2.3rem);
            font-weight: 800;
            background: linear-gradient(135deg, #1a2634, #2c3e50);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            margin-bottom: 8px;
        }

        .driver-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #e94560;
            background: rgba(233, 69, 96, 0.1);
            display: inline-block;
            padding: 4px 18px;
            border-radius: 60px;
            margin: 6px 0 12px;
        }

        .message {
            color: #4a5568;
            margin-bottom: 28px;
            line-height: 1.5;
            font-weight: 500;
            font-size: 1rem;
        }

        /* Stats grid — fully responsive */
        .stats {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin: 28px 0 32px;
            flex-wrap: wrap;
        }

        .stat-box {
            flex: 1;
            min-width: 100px;
            background: #f8fafd;
            padding: 14px 6px;
            border-radius: 28px;
            text-align: center;
            transition: all 0.25s ease;
            border: 1px solid rgba(233, 69, 96, 0.2);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
        }

        .stat-box:hover {
            transform: translateY(-6px);
            background: white;
            border-color: #e9456040;
            box-shadow: 0 18px 28px -12px rgba(233, 69, 96, 0.2);
        }

        .stat-box i {
            font-size: 1.8rem;
            background: linear-gradient(145deg, #e94560, #c62e4a);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 8px;
            display: inline-block;
        }

        .stat-box .number {
            font-size: 1.7rem;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.2;
        }

        .stat-box .label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #5b6e8c;
        }

        /* Button row */
        .btn-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin: 20px 0 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            border: none;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(105deg, #e94560, #b91c3c);
            color: white;
            box-shadow: 0 8px 18px -6px rgba(233, 69, 96, 0.5);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 24px -8px rgba(233, 69, 96, 0.6);
            background: linear-gradient(105deg, #f34f6b, #c41f42);
        }

        .btn-outline {
            background: rgba(255,255,255,0.8);
            border: 1.5px solid #e94560;
            color: #e94560;
            backdrop-filter: blur(2px);
        }

        .btn-outline:hover {
            background: #e94560;
            color: white;
            border-color: #e94560;
            transform: translateY(-2px);
        }

        /* Quote card */
        .quote {
            margin-top: 34px;
            padding: 16px 14px;
            background: #eff3f8;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1e2a44;
            border-left: 5px solid #e94560;
            text-align: left;
            transition: all 0.2s;
        }

        .quote i:first-child {
            color: #e94560;
            margin-right: 10px;
            font-size: 0.9rem;
        }

        /* Responsive master */
        @media (max-width: 540px) {
            .welcome-card {
                padding: 28px 20px;
                border-radius: 36px;
            }
            .stats {
                gap: 12px;
            }
            .stat-box .number {
                font-size: 1.4rem;
            }
            .btn-group {
                flex-direction: column;
                gap: 12px;
            }
            .btn {
                width: 100%;
                padding: 14px 20px;
            }
            .truck-logo {
                width: 85px;
                height: 85px;
            }
            .truck-logo i {
                font-size: 3.2rem;
            }
            .driver-name {
                font-size: 1rem;
            }
            .message {
                font-size: 0.9rem;
            }
            .quote {
                font-size: 0.78rem;
                padding: 14px;
            }
            .moving-truck {
                bottom: 2%;
                font-size: 2.7rem;
            }
        }

        @media (max-width: 380px) {
            .stat-box .label {
                font-size: 0.6rem;
            }
            .stat-box .number {
                font-size: 1.2rem;
            }
            .stat-box i {
                font-size: 1.4rem;
            }
        }

        /* touch-friendly & hide overscroll */
        a, button {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>

    <!-- ========== DYNAMIC BACKGROUND ========== -->
    <div class="bg-animation">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
        
        <div class="moving-truck">
            <i class="fas fa-truck-moving"></i>
        </div>
        
        <!-- floating industry icons -->
        <div class="float-icon ic-1"><i class="fas fa-boxes"></i></div>
        <div class="float-icon ic-2"><i class="fas fa-road"></i></div>
        <div class="float-icon ic-3"><i class="fas fa-charging-station"></i></div>
        <div class="float-icon ic-4"><i class="fas fa-trailer"></i></div>
        <div class="float-icon ic-5"><i class="fas fa-gas-pump"></i></div>
        <div class="float-icon ic-6"><i class="fas fa-route"></i></div>
        <div class="float-icon ic-7"><i class="fas fa-clock"></i></div>
    </div>
    <div id="particlesContainer" style="position: fixed; inset:0; pointer-events: none; z-index: 0;"></div>

    <!-- ========== MAIN CARD ========== -->
    <div class="welcome-card">
        <!-- Truck Logo replacing victory hand -->
        <div class="truck-logo">
            <i class="fas fa-truck-ramp-box"></i>
        </div>
        
        <h1>Ready to Roll</h1>
        <div class="driver-name" id="driverName">Driver</div>
        
        <p class="message">
            Your dispatch team is standing by 24/7. High-paying loads, real-time support, and maximum uptime — let's move!
        </p>
        
        <!-- dynamic stats -->
        <div class="stats">
            <div class="stat-box">
                <i class="fas fa-truck-fast"></i>
                <div class="number" id="activeLoads">0</div>
                <div class="label">Active Loads</div>
            </div>
            <div class="stat-box">
                <i class="fas fa-dollar-sign"></i>
                <div class="number" id="weeklyEarnings">$0</div>
                <div class="label">This Week</div>
            </div>
            <div class="stat-box">
                <i class="fas fa-shield-alt"></i>
                <div class="number" id="rating">0</div>
                <div class="label">Rating</div>
            </div>
        </div>
        
        <div class="btn-group">
            <a href="dashboard.html" class="btn btn-primary">
                <i class="fas fa-chalkboard-user"></i> Go to Dashboard
            </a>
            <a href="index.html" class="btn btn-outline">
                <i class="fas fa-home"></i> Home Page
            </a>
        </div>
        
        <div class="quote">
            <i class="fas fa-quote-left"></i>
            <span id="dailyQuote">Loading inspiration...</span>
        </div>
    </div>

    <script>
        // ========== RESPONSIVE PARTICLE GENERATOR (lightweight) ==========
        function generateParticles() {
            const container = document.getElementById('particlesContainer');
            if (!container) return;
            // Remove any existing particles to avoid duplicates on resize (dynamic)
            while (container.firstChild) container.removeChild(container.firstChild);
            
            // Determine particle count based on screen width (performance + beauty)
            const isMobile = window.innerWidth < 600;
            const particleCount = isMobile ? 35 : 65;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                const size = 2 + Math.random() * 5;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 9 + 's';
                particle.style.animationDuration = 6 + Math.random() * 7 + 's';
                particle.style.opacity = 0.3 + Math.random() * 0.5;
                particle.style.background = `rgba(233, 69, 96, ${0.3 + Math.random() * 0.5})`;
                container.appendChild(particle);
            }
        }
        
        // ========== LOAD USER DATA (NO PERSONAL NAME) ==========
        function loadDriverStatistics() {
            // Retrieve or initialize user data from localStorage
            let stored = localStorage.getItem('truckDispatchUser');
            let userData;
            
            if (!stored) {
                // Demo data with realistic values
                userData = {
                    activeLoads: 3,
                    weeklyEarnings: 4280,
                    rating: 4.92,
                    // no name field
                };
                localStorage.setItem('truckDispatchUser', JSON.stringify(userData));
            } else {
                userData = JSON.parse(stored);
                // ensure all keys exist
                if (userData.activeLoads === undefined) userData.activeLoads = 2;
                if (userData.weeklyEarnings === undefined) userData.weeklyEarnings = 3780;
                if (userData.rating === undefined) userData.rating = 4.8;
            }
            
            // Update DOM
            const loadsSpan = document.getElementById('activeLoads');
            const earningsSpan = document.getElementById('weeklyEarnings');
            const ratingSpan = document.getElementById('rating');
            
            if (loadsSpan) loadsSpan.innerText = userData.activeLoads;
            if (earningsSpan) earningsSpan.innerText = `$${userData.weeklyEarnings.toLocaleString()}`;
            if (ratingSpan) ratingSpan.innerText = userData.rating.toFixed(1);
            
            // Driver name fixed: no name asking, just "Driver" - no victory or custom name
            const driverNameSpan = document.getElementById('driverName');
            if (driverNameSpan) driverNameSpan.innerText = "Professional Driver";
        }
        
        // ========== ENERGIZING QUOTES (TRUCK THEME) ==========
        const truckQuotes = [
            "🏁 Keep the shiny side up & the rubber down — you're crushing it!",
            "💰 Dispatch just found 3 premium loads in your lane. Get ready!",
            "⛽ Full tank, full focus. Your best week is loading...",
            "📈 Top earner potential: +22% more miles this month. Stay on route!",
            "🛣️ Every successful mile builds your reputation. Keep delivering excellence.",
            "🎯 Dispatchers are actively bidding high rates for you. Let's secure them!",
            "⚡ 24/7 support: one call away. You're never alone on the road.",
            "🏆 Elite drivers finish strong. You've got this! 💪",
            "📦 Load secured, paperwork ready. Next stop: profit.",
            "🌟 Your rating is stellar — shippers request you first!"
        ];
        
        function setDailyTruckQuote() {
            const quoteSpan = document.getElementById('dailyQuote');
            if (quoteSpan) {
                const randomIdx = Math.floor(Math.random() * truckQuotes.length);
                quoteSpan.innerText = truckQuotes[randomIdx];
            }
        }
        
        // ========== UPDATE STATS (Simulate realtime refresh but keeps consistency) ==========
        // Optional: minor increment simulation for fresh vibe (won't override real values)
        function enhanceStatsAnimation() {
            // just visual spark — no overriding actual data
            const statNumbers = document.querySelectorAll('.stat-box .number');
            statNumbers.forEach(el => {
                el.style.transition = 'all 0.2s';
            });
        }
        
        // ========== RESIZE HANDLER FOR PARTICLES ==========
        let resizeTimer;
        window.addEventListener('resize', function() {
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                generateParticles();
            }, 200);
        });
        
        // ========== INITIALIZE EVERYTHING ==========
        function init() {
            generateParticles();
            loadDriverStatistics();
            setDailyTruckQuote();
            enhanceStatsAnimation();
            
            // Optional: add dynamic stat hover effect smoothness
            const boxes = document.querySelectorAll('.stat-box');
            boxes.forEach((box, idx) => {
                box.style.animation = `fadeInUp 0.4s ease ${idx * 0.07}s forwards`;
                box.style.opacity = '0';
            });
            // Add tiny fadein keyframe if not defined
            const styleSheet = document.createElement("style");
            styleSheet.textContent = `
                @keyframes fadeInUp {
                    from { opacity: 0; transform: translateY(15px); }
                    to { opacity: 1; transform: translateY(0); }
                }
                .stat-box {
                    animation-fill-mode: forwards;
                }
            `;
            document.head.appendChild(styleSheet);
        }
        
        // Run after full load
        window.addEventListener('DOMContentLoaded', init);
        
        // also regenerate particles after fonts loaded for smoothness
        window.addEventListener('load', () => {
            generateParticles(); // ensure perfect fit
        });
        
        // For any dynamic user interaction : if someone updates earnings later (simulate)
        // But we keep consistent
        if (localStorage.getItem('truckDispatchUser') === null) {
            // pre-seed for demo
            const defaultData = {
                activeLoads: 3,
                weeklyEarnings: 4280,
                rating: 4.92
            };
            localStorage.setItem('truckDispatchUser', JSON.stringify(defaultData));
            loadDriverStatistics();
        }
    </script>
</body>
</html>
